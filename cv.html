<style>
/* The CV used to be a bare link to the PDF, which left the browser's own
   viewer to decide whether anything appeared at all. On several of them it
   paints its dark ground and never draws the page. This page shows the
   document itself as an image, so it is always visible, and keeps the PDF
   one click away for anyone who wants the real file. */
.cv-page { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--void); }

.cv-bar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: var(--s4); flex-wrap: wrap;
  padding: max(var(--s4), env(safe-area-inset-top)) max(var(--gutter), env(safe-area-inset-right)) var(--s4) max(var(--gutter), env(safe-area-inset-left));
  background: var(--void); border-bottom: 1px solid var(--line);
}
.cv-back {
  display: inline-flex; align-items: center; gap: 8px;
  font: 600 var(--fs-mono) var(--f-mark); letter-spacing: .13em; text-transform: uppercase;
  color: #FFFFFF; background: var(--violet); border: 1px solid var(--violet);
  padding: 10px 18px; border-radius: var(--r-control);
  transition: background var(--t-2) var(--e-out), border-color var(--t-2) var(--e-out);
}
.cv-back::before {
  content: ""; width: .38em; height: .38em; flex: none;
  border: 0 solid currentColor; border-left-width: 1.6px; border-bottom-width: 1.6px;
  transform: translate(.08em, .01em) rotate(45deg);
  transition: transform var(--t-3) var(--e-out);
}
.cv-back:hover, .cv-back:focus-visible { background: var(--tx-1); border-color: var(--tx-1); }
.cv-back:hover::before, .cv-back:focus-visible::before { transform: translate(calc(.08em - 4px), .01em) rotate(45deg); }

.cv-bar-label {
  font: 600 var(--fs-mono) var(--f-mark); letter-spacing: .13em;
  text-transform: uppercase; color: var(--tx-3);
}
.cv-actions { margin-left: auto; display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.cv-action {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px;
  font: 600 var(--fs-mono) var(--f-mark); letter-spacing: .13em; text-transform: uppercase;
  color: var(--violet); background: var(--tint);
  border: 1px solid var(--line-2); border-radius: var(--r-control);
  transition: background var(--t-2) var(--e-out), border-color var(--t-2) var(--e-out);
}
.cv-action:hover, .cv-action:focus-visible { background: var(--tint-2); border-color: var(--violet); }

.cv-stage { flex: 1; padding: clamp(20px, 3.4vw, 56px) max(var(--gutter), env(safe-area-inset-right)) calc(var(--s9) + env(safe-area-inset-bottom)) max(var(--gutter), env(safe-area-inset-left)); }
.cv-sheet {
  max-width: 1080px; margin-inline: auto;
  background: var(--paper); border: 1px solid var(--line-ink);
  border-radius: var(--r-card); overflow: hidden;
}
.cv-sheet img { display: block; width: 100%; height: auto; }


/* Same on the CV page: the bar stacked into three rows on a phone. */
@media (max-width: 720px) {
  .cv-bar {
    display: grid; grid-template-columns: auto 1fr;
    grid-template-areas: "back actions" "label label";
    align-items: center; gap: 10px var(--s3);
  }
  .cv-back { grid-area: back; }
  .cv-actions { grid-area: actions; margin-left: 0; width: auto; justify-self: end; }
  .cv-bar-label { grid-area: label; }
}
@media print {
  .cv-bar { display: none; }
  .cv-stage { padding: 0; }
  .cv-sheet { border: 0; border-radius: 0; max-width: none; }
}
</style>
</head>
